name: proof
# шаурматч_ — запуск одной командой:  docker compose up -d --build
# Откройте http://localhost (порт меняется переменной HTTP_PORT в .env)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: proof
      POSTGRES_PASSWORD: ${DB_PASSWORD:-proof}
      POSTGRES_DB: proof
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proof"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  engine:
    build: { context: ., dockerfile: engine/Dockerfile, args: { DEBIAN_MIRROR: "${DEBIAN_MIRROR:-}" } }
    volumes: [models:/data/models]      # модели «Маринада», дообученные на живых данных
    environment:
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
    restart: unless-stopped

  fsp-mock:
    build: { context: ., dockerfile: fsp-mock/Dockerfile }
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports: ["${MAIL_UI_PORT:-8025}:8025"]
    restart: unless-stopped

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    depends_on:
      db: { condition: service_healthy }
      engine: { condition: service_started }
      fsp-mock: { condition: service_started }
    environment:
      DATABASE_URL: postgres://proof:${DB_PASSWORD:-proof}@db:5432/proof
      ENGINE_URL: http://engine:8001
      FSP_URL: http://fsp-mock:8002
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-шаурматч_ <no-reply@shaurmatch.local>}
      DEMO_MODE: ${DEMO_MODE:-true}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_CANDIDATES: ${SEED_CANDIDATES:-360}
      CALIBRATE_EVERY: ${CALIBRATE_EVERY:-300}   # «Маринад»: перекалибровка теста каждые N новых ответов
      RANKER_EVERY: ${RANKER_EVERY:-20}          # дообучение подбора каждые N ответов на приглашения
      PRACTICE_EVERY_DAYS: ${PRACTICE_EVERY_DAYS:-7}  # «Свежая начинка»: адресная задача кандидату не чаще раза в N дней
    restart: unless-stopped

  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    depends_on: [backend]
    ports: ["${HTTP_PORT:-80}:80"]
    restart: unless-stopped

volumes:
  pgdata:
  models:
